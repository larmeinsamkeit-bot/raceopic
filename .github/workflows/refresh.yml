name: Refresh race data

# After each race weekend: fetch new data, rebuild the snapshots, score finished forecasts,
# run the unit tests, and open a pull request with whatever changed.
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC, after the weekend's race
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh data
        run: python -B data-tools/refresh.py --cache "$RUNNER_TEMP/raceopic-cache"
      - name: Unit tests
        run: python -B -m unittest discover -s data-tools/tests -v
      - name: Open a pull request with the new data
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          delete-branch: true
          commit-message: Refresh race data and score finished forecasts
          title: Refresh race data
          body: |
            Automated refresh from `data-tools/refresh.py`: calendar, standings and race archives,
            lab files for newly completed rounds, per-lap weather, teammate head-to-heads, and scores
            for forecasts whose race has finished. Review the forecast scores before merging.
          add-paths: dist
